# =============================================================================
# Security Headers Configuration for themodernparentzone.com
# Compatible with Apache (.htaccess) and nginx (include in server block)
# Last updated: 2026-03-24
# =============================================================================
#
# INSTALLATION:
#
# --- Apache (.htaccess) ---
# Copy the <IfModule mod_headers.c> block into your .htaccess file in the
# WordPress root directory, or include this file via your Apache vhost config.
#
# --- Nginx ---
# Copy the add_header directives into your server {} block, or use:
#   include /path/to/security-headers.conf;
# inside the server block. Remove the Apache wrapper lines.
#
# =============================================================================


# =============================================================================
# APACHE CONFIGURATION
# =============================================================================
<IfModule mod_headers.c>

    # -------------------------------------------------------------------------
    # HTTP Strict Transport Security (HSTS)
    # Forces HTTPS for 1 year, includes subdomains, allows preload submission
    # -------------------------------------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # -------------------------------------------------------------------------
    # Content Security Policy (CSP)
    # Tuned for WordPress + Elementor + common integrations
    # -------------------------------------------------------------------------
    Header always set Content-Security-Policy "\
        default-src 'self'; \
        script-src 'self' 'unsafe-inline' 'unsafe-eval' \
            https://www.googletagmanager.com \
            https://www.google-analytics.com \
            https://analytics.google.com \
            https://connect.facebook.net \
            https://assets.pinterest.com \
            https://snap.licdn.com \
            https://cdn.jsdelivr.net \
            https://cdnjs.cloudflare.com; \
        style-src 'self' 'unsafe-inline' \
            https://fonts.googleapis.com \
            https://cdn.jsdelivr.net \
            https://cdnjs.cloudflare.com; \
        img-src 'self' data: blob: \
            https://www.google-analytics.com \
            https://analytics.google.com \
            https://www.googletagmanager.com \
            https://i.pinimg.com \
            https://ct.pinterest.com \
            https://www.facebook.com \
            https://px.ads.linkedin.com \
            https://secure.gravatar.com \
            https://i0.wp.com \
            https://i1.wp.com \
            https://i2.wp.com; \
        font-src 'self' data: \
            https://fonts.gstatic.com \
            https://cdn.jsdelivr.net \
            https://cdnjs.cloudflare.com; \
        connect-src 'self' \
            https://www.google-analytics.com \
            https://analytics.google.com \
            https://www.googletagmanager.com \
            https://fonts.googleapis.com \
            https://fonts.gstatic.com; \
        frame-src 'self' \
            https://www.youtube.com \
            https://www.youtube-nocookie.com \
            https://player.vimeo.com \
            https://open.spotify.com \
            https://www.google.com; \
        object-src 'none'; \
        base-uri 'self'; \
        form-action 'self'; \
        frame-ancestors 'self'; \
        upgrade-insecure-requests"

    # -------------------------------------------------------------------------
    # X-Content-Type-Options
    # Prevents MIME-type sniffing
    # -------------------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"

    # -------------------------------------------------------------------------
    # X-Frame-Options
    # Prevents clickjacking by disallowing framing from other origins
    # -------------------------------------------------------------------------
    Header always set X-Frame-Options "SAMEORIGIN"

    # -------------------------------------------------------------------------
    # X-XSS-Protection
    # Legacy XSS filter - still useful for older browsers
    # -------------------------------------------------------------------------
    Header always set X-XSS-Protection "1; mode=block"

    # -------------------------------------------------------------------------
    # Referrer-Policy
    # Sends origin + path for same-origin, only origin for cross-origin
    # -------------------------------------------------------------------------
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # -------------------------------------------------------------------------
    # Permissions-Policy
    # Restricts browser feature access
    # -------------------------------------------------------------------------
    Header always set Permissions-Policy "\
        accelerometer=(), \
        ambient-light-sensor=(), \
        autoplay=(self), \
        battery=(), \
        camera=(), \
        cross-origin-isolated=(), \
        display-capture=(), \
        document-domain=(), \
        encrypted-media=(self), \
        execution-while-not-rendered=(), \
        execution-while-out-of-viewport=(), \
        fullscreen=(self), \
        geolocation=(), \
        gyroscope=(), \
        magnetometer=(), \
        microphone=(), \
        midi=(), \
        navigation-override=(), \
        payment=(), \
        picture-in-picture=(self), \
        publickey-credentials-get=(), \
        screen-wake-lock=(), \
        serial=(), \
        sync-xhr=(self), \
        usb=(), \
        xr-spatial-tracking=()"

    # -------------------------------------------------------------------------
    # Cross-Origin Policies
    # -------------------------------------------------------------------------
    Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"
    Header always set Cross-Origin-Resource-Policy "cross-origin"

    # -------------------------------------------------------------------------
    # Remove server information headers
    # -------------------------------------------------------------------------
    Header always unset X-Powered-By
    Header always unset Server

</IfModule>


